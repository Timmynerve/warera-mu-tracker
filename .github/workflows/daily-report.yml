name: Daily report

on:
  schedule:
    # 17:37 UTC = 18:37 in Paris in winter (19:37 in summer); off the busy top of the hour
    - cron: "37 17 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build report
        env:
          # read-only token for the equipment sales history used by the OpTimmyZer tab (optional)
          WARERA_API_TOKEN: ${{ secrets.WARERA_API_TOKEN }}
        run: |
          mkdir -p _site
          python -I warera_mu_report.py --user Timmynerve --days 7 --out _site/index.html
          rm -f _site/index.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
